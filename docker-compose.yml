version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    networks:
      - app-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge
